name: Build Pico Copter FC UF2 and deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "firmware/pico_copter/**"
      - "web/**"
      - ".github/workflows/build-and-deploy.yml"
      - "README.md"
  pull_request:
    paths:
      - "firmware/pico_copter/**"
      - ".github/workflows/build-and-deploy.yml"

permissions:
  contents: read

concurrency:
  group: pico-copter-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PICO_SDK_REF: 2.3.0
  EIGEN_VERSION: 3.4.0
  EIGEN_REF: 3147391d946bb4b6c68edd901f2add6ac1f31f8c
  CCACHE_MAXSIZE: 500M

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore Pico SDK cache
        id: pico-sdk-cache
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ runner.os }}-${{ env.PICO_SDK_REF }}

      - name: Checkout Pico SDK on cache miss
        if: steps.pico-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_REF }}
          path: pico-sdk
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Disable push to Pico SDK remote
        shell: bash
        run: |
          set -euxo pipefail
          git -C pico-sdk remote set-url --push origin DISABLED
          git -C pico-sdk remote -v

      - name: Restore Eigen cache
        id: eigen-cache
        uses: actions/cache@v4
        with:
          path: third_party/eigen
          key: eigen-${{ runner.os }}-${{ env.EIGEN_REF }}

      - name: Checkout Eigen 3.4.0 on cache miss
        if: steps.eigen-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf third_party/eigen
          mkdir -p third_party
          git clone \
            --branch "${EIGEN_VERSION}" \
            --depth 1 \
            https://gitlab.com/libeigen/eigen.git \
            third_party/eigen
          test "$(git -C third_party/eigen rev-parse HEAD)" = "${EIGEN_REF}"
          rm -rf third_party/eigen/.git

      - name: Verify Eigen dependency
        shell: bash
        run: |
          set -euxo pipefail
          test -f third_party/eigen/Eigen/Dense
          grep -q "#define EIGEN_WORLD_VERSION 3" \
            third_party/eigen/Eigen/src/Core/util/Macros.h
          grep -q "#define EIGEN_MAJOR_VERSION 4" \
            third_party/eigen/Eigen/src/Core/util/Macros.h
          grep -q "#define EIGEN_MINOR_VERSION 0" \
            third_party/eigen/Eigen/src/Core/util/Macros.h

      - name: Install ARM toolchain and ccache
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            ccache \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            ninja-build

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            ccache-${{ runner.os }}-pico-${{ env.PICO_SDK_REF }}-${{ env.EIGEN_REF }}-${{ hashFiles('firmware/pico_copter/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-pico-${{ env.PICO_SDK_REF }}-${{ env.EIGEN_REF }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk" >> "${GITHUB_ENV}"
          echo "EIGEN3_INCLUDE_DIR=${GITHUB_WORKSPACE}/third_party/eigen" >> "${GITHUB_ENV}"
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> "${GITHUB_ENV}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "CCACHE_NOHASHDIR=true" >> "${GITHUB_ENV}"
          echo "CCACHE_COMPILERCHECK=content" >> "${GITHUB_ENV}"
          mkdir -p "${GITHUB_WORKSPACE}/.ccache"
          CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache" \
            ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache" \
            ccache --set-config=compression=true
          CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache" ccache --zero-stats

      - name: Test SBUS parser and link recovery
        shell: bash
        run: |
          set -euxo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -I firmware/pico_copter \
            firmware/pico_copter/tests/test_sbus.cpp -o /tmp/sbus-test
          /tmp/sbus-test

      - name: Configure Pico Copter
        shell: bash
        run: |
          set -o pipefail
          cmake \
            -S firmware/pico_copter \
            -B build \
            -G Ninja \
            -DPICO_SDK_PATH="${PICO_SDK_PATH}" \
            -DEIGEN3_INCLUDE_DIR="${EIGEN3_INCLUDE_DIR}" \
            -DPICO_BOARD=pico \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            2>&1 | tee configure.log

      - name: Build Pico Copter UF2
        shell: bash
        run: |
          set -o pipefail
          {
            cmake --build build \
              --target pico_copter \
              --parallel "$(nproc)"
            test -s build/pico_copter.uf2
            echo
            echo "=== ccache statistics ==="
            ccache --show-stats
          } 2>&1 | tee build.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pico-copter-build-logs-${{ github.run_number }}
          path: |
            configure.log
            build.log
          if-no-files-found: warn
          retention-days: 1

      - name: Prepare firmware and Pages site
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf output site
          mkdir -p output site/firmware
          cp -a web/. site/

          for DEST in output site/firmware; do
            cp build/pico_copter.uf2 "${DEST}/pico_copter.uf2"
            sha256sum build/pico_copter.uf2 \
              | sed 's#  .*#  pico_copter.uf2#' \
              > "${DEST}/pico_copter.uf2.sha256"
            stat -c '%s' build/pico_copter.uf2 > "${DEST}/size.txt"
            cp configure.log build.log "${DEST}/"
          done

          export UF2_SHA256 UF2_SIZE BUILT_AT
          UF2_SHA256="$(sha256sum build/pico_copter.uf2 | cut -d ' ' -f 1)"
          UF2_SIZE="$(stat -c '%s' build/pico_copter.uf2)"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "appId": "pico_copter",
              "appName": "Pico Copter",
              "description": "firmware/pico_copter内のプログラムからビルドしたUF2です。",
              "boardId": "pico",
              "boardName": "Raspberry Pi Pico",
              "file": "pico_copter.uf2",
              "downloadName": "pico_copter-pico.uf2",
              "size": int(os.environ["UF2_SIZE"]),
              "sha256": os.environ["UF2_SHA256"],
              "sourceCommit": os.environ["GITHUB_SHA"],
              "sourcePath": "firmware/pico_copter",
              "picoSdkRef": os.environ["PICO_SDK_REF"],
              "eigenVersion": os.environ["EIGEN_VERSION"],
              "eigenRef": os.environ["EIGEN_REF"],
              "builtAt": os.environ["BUILT_AT"],
              "repository": os.environ["GITHUB_REPOSITORY"],
          }

          text = json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          Path("output/manifest.json").write_text(text, encoding="utf-8")
          Path("site/firmware/manifest.json").write_text(text, encoding="utf-8")
          PY

      - name: Upload Pico Copter firmware
        uses: actions/upload-artifact@v7
        with:
          name: pico-copter-uf2-${{ github.run_number }}
          path: output
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
